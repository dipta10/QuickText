name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.0-pre.${{ github.run_number }}
  KEEP_RELEASES: "10"

jobs:
  publish-release:
    name: Build bundles (${{ matrix.settings.platform }})
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        if: matrix.settings.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build bundles and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            Dictate, get instant text, copy it anywhere. Press once to record, press again to stop — your words appear as text you can paste into anything.

            ## Which file do I download?

            | Your computer | Download |
            |---|---|
            | Windows | `QuickText_0.1.0_x64-setup.exe` (installer) or `.msi` |
            | Mac (Apple Silicon / M1–M4) | `QuickText_0.1.0_aarch64.dmg` |
            | Linux | `.AppImage` (just run it) or `.deb` / `.rpm` |

            ## First-time setup

            1. Install and open QuickText.
            2. Go to **Settings** and paste your [Soniox](https://soniox.com) API key.
            3. Hit the big button (or your shortcut) and start talking.

            ## Heads-up

            This build is **unsigned**, so your OS will act suspicious:

            - **Windows**: SmartScreen may say "Unknown publisher" → click *More info* → *Run anyway*.
            - **macOS**: right-click the app → *Open* → *Open* again. Normal Gatekeeper behavior.
            - **Linux**: no fuss.

            A build like this is published on every merge to main; older builds stay available on the [releases page](../../releases). Bug reports welcome!
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "QuickText — Speech-to-Text for Your Desktop (${{ env.RELEASE_TAG }})"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false

  cleanup-old-releases:
    name: Prune releases beyond newest ${{ env.KEEP_RELEASES }}
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases older than the newest ${{ env.KEEP_RELEASES }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName --jq '.[${{ env.KEEP_RELEASES }}:][]?.tagName')

          if [ -z "$tags" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          while read -r tag; do
            echo "Deleting old release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done <<< "$tags"
