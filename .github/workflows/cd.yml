name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.0-pre.${{ github.run_number }}
  KEEP_RELEASES: "10"

jobs:
  publish-release:
    name: Build bundles (${{ matrix.settings.platform }})
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        if: matrix.settings.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build bundles and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            Dictate, get instant text, copy it anywhere. Press once to record, press again to stop — your words appear as text you can paste into anything.

            ## Which file do I download?

            | Your computer | Download |
            |---|---|
            | Windows | `QuickText_0.1.0_x64-setup.exe` (installer) or `.msi` |
            | Mac (Apple Silicon / M1–M4) | `QuickText_0.1.0_aarch64.dmg` |
            | Arch / Manjaro (x86_64) | `quicktext-0.1.0-${{ github.run_number }}-x86_64.pkg.tar.zst` |
            | Debian / Ubuntu (x86_64) | `.deb` |
            | Fedora / RPM-based Linux (x86_64) | `.rpm` |
            | Other Linux (x86_64) | `.AppImage` (see the Wayland note below) |

            ## First-time setup

            1. Install and open QuickText.
            2. Go to **Settings** and paste your [Soniox](https://soniox.com) API key.
            3. Hit the big button (or your shortcut) and start talking.

            On Arch or Manjaro, install the downloaded native package with:

            ```bash
            sudo pacman -U ./quicktext-0.1.0-${{ github.run_number }}-x86_64.pkg.tar.zst
            ```

            ## Heads-up

            This build is **unsigned**, so your OS will act suspicious:

            - **Windows**: SmartScreen may say "Unknown publisher" → click *More info* → *Run anyway*.
            - **macOS**: first launch may say "cannot verify the developer" → right-click the app → *Open* → *Open* again. If it instead says "damaged", run `xattr -cr /Applications/QuickText.app` in Terminal and open it again.
            - **AppImage on newer Wayland/Mesa systems**: prefer the native package above on Arch or Manjaro. If an AppImage opens a blank window and prints `EGL_BAD_PARAMETER`, launch it from its download folder with:

              ```bash
              LD_PRELOAD=/usr/lib/libwayland-client.so.0 WEBKIT_DISABLE_DMABUF_RENDERER=1 ./QuickText_0.1.0_amd64.AppImage
              ```

              This is a temporary workaround for an AppImage compatibility issue on newer Mesa/Wayland systems.

            A build like this is published on every merge to main; older builds stay available on the [releases page](../../releases). Bug reports welcome!
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "QuickText — Speech-to-Text for Your Desktop (${{ env.RELEASE_TAG }})"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false

  publish-arch-package:
    name: Build native Arch package
    needs: publish-release
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - name: Install Arch build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            alsa-lib \
            git \
            github-cli \
            gtk3 \
            libayatana-appindicator \
            libsecret \
            nodejs-lts-jod \
            npm \
            openssl \
            rust \
            webkit2gtk-4.1 \
            wtype \
            xdotool

      - uses: actions/checkout@v4

      - name: Prepare unprivileged package builder
        run: |
          useradd --create-home package-builder
          chown -R package-builder:package-builder "$GITHUB_WORKSPACE"

      - name: Build pacman package
        working-directory: packaging/arch
        run: |
          runuser -u package-builder -- env \
            QUICKTEXT_PKGREL="$GITHUB_RUN_NUMBER" \
            QUICKTEXT_SOURCE_REVISION="$GITHUB_SHA" \
            QUICKTEXT_SOURCE_URL="file://$GITHUB_WORKSPACE" \
            makepkg --cleanbuild --clean --noconfirm

      - name: Inspect package metadata and contents
        run: |
          pacman -Qip packaging/arch/quicktext-*.pkg.tar.zst
          pacman -Qlp packaging/arch/quicktext-*.pkg.tar.zst

      - name: Upload Arch package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$RELEASE_TAG"
          packaging/arch/quicktext-*.pkg.tar.zst
          --repo "$GITHUB_REPOSITORY"
          --clobber

  cleanup-old-releases:
    name: Prune releases beyond the newest 10
    needs: [publish-release, publish-arch-package]
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases older than the newest 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName --jq '.[${{ env.KEEP_RELEASES }}:][]?.tagName')

          if [ -z "$tags" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          while read -r tag; do
            echo "Deleting old release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done <<< "$tags"
